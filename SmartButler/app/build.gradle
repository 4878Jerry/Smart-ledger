plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.ousuan.smartbutler'
    compileSdk 34

    defaultConfig {
        applicationId "com.ousuan.smartbutler"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    // Vosk 依赖 JNA（jnidispatch.so）：排除重复的 META-INF 资源，并优先保留 jnidispatch 动态库，
    // 避免 UnsatisfiedLinkError: Native library (.../libjnidispatch.so) not found
    packagingOptions {
        resources {
            excludes += "META-INF/**"
            pickFirsts += "**/libjnidispatch.so"
        }
    }
}

dependencies {
    // AndroidX 基础
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Room 数据库
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // MPAndroidChart 图表
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ML Kit 中文文字识别（离线 bundled 模型）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'

    // 网络层：Retrofit + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Vosk 离线语音识别（模型在 assets/model 下，不依赖 Google 服务）
    // 排除 vosk 传递引入的 jna JAR，避免与下方 jna@aar 同时上 classpath 产生 Duplicate class 冲突。
    // JNA 在 Android 上必须使用 @aar 变体：普通 JAR 不打入 libjnidispatch.so，会导致 UnsatisfiedLinkError。
    implementation('com.alphacephei:vosk-android:0.3.45') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    // JNA：Vosk native 层依赖 jnidispatch 动态库，显式引入 AAR 保证 libjnidispatch.so 打入 APK
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}
